<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Rune Calculator</title>
    <style>
        :root { --primary: #2563eb; --bg: #f8fafc; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: #334155; padding: 20px; display: flex; justify-content: center; }
        .container { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); max-width: 500px; width: 100%; }
        h2 { margin-top: 0; color: var(--primary); border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; }
        .section { margin-bottom: 20px; }
        label { font-weight: 600; font-size: 0.9rem; display: block; margin-bottom: 5px; }
        select, input { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; }
        .inventory-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; max-height: 200px; overflow-y: auto; padding-right: 5px; border: 1px solid #f1f5f9; padding: 10px; border-radius: 6px; }
        .inventory-item { display: flex; flex-direction: column; }
        .result-panel { background: #eff6ff; padding: 15px; border-radius: 8px; border: 1px solid #dbeafe; margin-top: 20px; }
        .stat { display: flex; justify-content: space-between; margin-bottom: 8px; }
        .stat b { color: var(--primary); }
    </style>
</head>
<body>

<div class="container">
    <h2>Rune Master Calc</h2>
    
    <div class="section">
        <label>Your Goal Rune:</label>
        <select id="goalRune" onchange="calculate()"></select>
    </div>

    <div class="section">
        <label>Your Current Inventory (Owned):</label>
        <div class="inventory-grid" id="inventoryInputs"></div>
    </div>

    <div class="result-panel">
        <div class="stat"><span>Total T1 Value of Goal:</span> <span id="goalValue">0</span></div>
        <div class="stat"><span>Your Current T1 Value:</span> <span id="currentValue">0</span></div>
        <hr style="border: 0; border-top: 1px solid #dbeafe;">
        <div class="stat"><span>Remaining T1s Needed:</span> <b id="neededT1">0</b></div>
        <div class="stat"><span>Est. Silver Cost (2/merge):</span> <b id="silverCost">0</b></div>
    </div>
</div>

<script>
    const SILVER_PER_MERGE = 2;
    const runeList = [];
    const maxTier = 5;
    const starsPerTier = 3;

    // Build Rune Data Object
    let power = 0;
    for (let t = 1; t <= maxTier; t++) {
        for (let s = 1; s <= starsPerTier; s++) {
            if (t === 5 && s > 1) break;
            const name = `T${t}-${s}★`;
            const t1Value = Math.pow(2, power);
            runeList.push({ name, t1Value });
            power++;
        }
    }

    // Setup UI
    const goalSelect = document.getElementById('goalRune');
    const invGrid = document.getElementById('inventoryInputs');

    runeList.forEach((rune, index) => {
        // Populate Dropdown
        let opt = document.createElement('option');
        opt.value = rune.t1Value;
        opt.textContent = rune.name;
        if(index === runeList.length - 1) opt.selected = true;
        goalSelect.appendChild(opt);

        // Populate Inventory Inputs
        const div = document.createElement('div');
        div.className = 'inventory-item';
        div.innerHTML = `
            <label style="font-size: 0.75rem">${rune.name}</label>
            <input type="number" min="0" value="0" class="inv-input" data-value="${rune.t1Value}" oninput="calculate()">
        `;
        invGrid.appendChild(div);
    });

    function calculate() {
        const goalT1Value = parseInt(goalSelect.value);
        let currentT1Value = 0;

        // Calculate total value of what user owns
        document.querySelectorAll('.inv-input').forEach(input => {
            const count = parseInt(input.value) || 0;
            const val = parseInt(input.getAttribute('data-value'));
            currentT1Value += (count * val);
        });

        const needed = Math.max(0, goalT1Value - currentT1Value);
        
        // Logic: To get "needed" T1s into higher tiers, you perform (needed - 1) merges.
        // If they already have enough, cost is 0.
        const silver = needed > 0 ? (needed - 1) * SILVER_PER_MERGE : 0;

        // Update Display
        document.getElementById('goalValue').textContent = goalT1Value.toLocaleString();
        document.getElementById('currentValue').textContent = currentT1Value.toLocaleString();
        document.getElementById('neededT1').textContent = needed.toLocaleString();
        document.getElementById('silverCost').textContent = silver.toLocaleString() + " Silver";
    }

    // Initial run
    calculate();
</script>

</body>
</html>
