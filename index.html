<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eternal Idle Rune Calc</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="p-4 md:p-10">

    <div class="max-w-5xl mx-auto">
        <div class="flex justify-between items-center mb-4">
            <h1 class="text-2xl font-black italic tracking-tighter uppercase text-white">RUNE CALC <span class="text-blue-500">V0.0.2</span></h1>
        </div>

        <!-- Tab Bar -->
        <div class="flex gap-3 mb-6">
            <button id="tabGoalBtn" class="tab-btn tab-btn-active" onclick="switchTab('goal')">Goal Calculator</button>
            <button id="tabInvBtn" class="tab-btn tab-btn-inactive" onclick="switchTab('inventory')">Inventory Total</button>
            <button id="resetBtn" onclick="resetCurrentTab()" class="text-[10px] font-bold tracking-widest text-slate-500 hover:text-red-400 uppercase ml-auto">Reset This Tab</button>
        </div>

        <!-- ====== GOAL CALCULATOR TAB ====== -->
        <div id="goalTabPanel" class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            <div class="lg:col-span-4 space-y-6">
                <div class="bw-card p-6">
                    <label class="block text-[10px] font-bold text-slate-400 uppercase mb-3">Target Objective</label>
                    <select id="goalRune" onchange="calculateGoal()" class="bw-input w-full p-4 rounded-xl font-bold text-lg cursor-pointer mb-6"></select>
                    
                    <div class="p-4 bg-[#0b1221] rounded-xl border border-[#242f45]">
                        <p id="progressText" class="text-center text-xs font-bold mb-2 text-blue-400">0.00% Complete</p>
                        <div class="w-full bg-slate-800 rounded-full h-1.5">
                            <div id="progressBar" class="bg-blue-500 h-1.5 rounded-full transition-all duration-500" style="width: 0%"></div>
                        </div>
                    </div>
                </div>

                <div class="bw-card p-6 space-y-6">
                    <div>
                        <p class="text-[10px] text-slate-400 font-bold uppercase mb-1">Runes to Acquire</p>
                        <p id="neededT1" class="text-3xl font-mono font-bold text-white tracking-tight">0</p>
                    </div>
                    <div>
                        <p class="text-[10px] text-slate-400 font-bold uppercase mb-1">Silver Required</p>
                        <p id="silverCost" class="text-2xl font-mono font-bold text-yellow-500 tracking-tight">0</p>
                    </div>
                </div>
            </div>

            <div class="lg:col-span-8">
                <div class="bw-card p-6">
                    <div class="flex justify-between items-center mb-4 border-b border-slate-700 pb-2">
                        <label class="text-[10px] font-bold text-slate-400 uppercase">Current Stockpile</label>
                        <span class="text-[9px] text-slate-600 uppercase font-bold tracking-widest">Values Save Automatically</span>
                    </div>
                    
                    <div id="goalInventoryContainer" class="max-h-[600px] overflow-y-auto pr-2"></div>
                </div>
            </div>
        </div>

        <!-- ====== INVENTORY TOTAL TAB ====== -->
        <div id="inventoryTabPanel" class="hidden grid grid-cols-1 lg:grid-cols-12 gap-8 panel-hidden">
            <div class="lg:col-span-4 space-y-6">
                <div class="bw-card p-6">
                    <p class="text-[10px] text-slate-400 font-bold uppercase mb-1">Total Rune Value</p>
                    <p id="invTotalValue" class="text-3xl font-mono font-bold text-white tracking-tight">0</p>
                    <p class="text-[9px] text-slate-500 font-bold uppercase mt-1">T1 Common Equivalent</p>
                </div>
            </div>

            <div class="lg:col-span-8">
                <div class="bw-card p-6">
                    <div class="flex justify-between items-center mb-4 border-b border-slate-700 pb-2">
                        <label class="text-[10px] font-bold text-slate-400 uppercase">My Rune Inventory</label>
                        <span class="text-[9px] text-slate-600 uppercase font-bold tracking-widest">Values Save Automatically</span>
                    </div>
                    
                    <div id="invInventoryContainer" class="max-h-[600px] overflow-y-auto pr-2"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
